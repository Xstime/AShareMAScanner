name: Publish v1.2.8 single-file PYw release

on:
  push:
    branches:
      - main
    paths:
      - 'A股MA扫描器_v1.2.8.pyw'
      - '.github/workflows/release-v1.2.8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate single-file Tkinter scanner
        run: |
          python -m py_compile A股MA扫描器_v1.2.8.pyw
          python - <<'PY'
          from pathlib import Path
          s=Path('A股MA扫描器_v1.2.8.pyw').read_text(encoding='utf-8')
          assert "APP_VERSION = \"1.2.8\"" in s
          assert "stock_fund_flow_industry(symbol='5日排行')" in s
          assert 'em_rank' not in s
          assert 'PySide6' not in s
          assert '_fetch_same_source_members' not in s
          assert '_limit_to_fund_top5' not in s
          PY
      - name: Install offline test prerequisites
        run: python -m pip install pandas
      - name: Prepare virtual graphical display
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Run all scanner regression tests
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Prepare downloadable PYw and ZIP package
        run: |
          cp 'A股MA扫描器_v1.2.8.pyw' AShareMAScanner_v1.2.8.pyw
          python - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('AShareMAScanner_v1.2.8.zip','w',ZIP_DEFLATED) as z:
              for name in ['A股MA扫描器_v1.2.8.pyw','requirements.txt','README.md']:
                  z.write(name)
          PY
      - name: Publish verified standalone source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.2.8 >/dev/null 2>&1; then
            gh release create v1.2.8 --target "$GITHUB_SHA" \
              --title "v1.2.8 · 纯 Tkinter 单文件 / 同花顺 TOP5" \
              --notes-file RELEASE_NOTES_v1.2.8.md --latest
          fi
          gh release upload v1.2.8 AShareMAScanner_v1.2.8.pyw AShareMAScanner_v1.2.8.zip --clobber
