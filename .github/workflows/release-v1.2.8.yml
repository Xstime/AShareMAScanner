name: Publish v1.2.8 three-stage PySide6 + Tkinter PYw

on:
  push:
    branches:
      - main
    paths:
      - 'A股MA扫描器_v1.2.8.pyw'
      - '.github/workflows/release-v1.2.8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install source dependencies (not embedded in Python file)
        run: python -m pip install -r requirements.txt
      - name: Check hybrid single-file launcher
        run: |
          python -m py_compile A股MA扫描器_v1.2.8.pyw
          python - <<'PY'
          from pathlib import Path
          s=Path('A股MA扫描器_v1.2.8.pyw').read_text(encoding='utf-8')
          assert 'APP_VERSION = "1.2.8"' in s
          assert 'def _bootstrap_dependencies(' in s
          assert 'def run_tk_data_phase(' in s
          assert 'class ScannerWindow(QMainWindow)' in s
          assert 'from PySide6.QtCore import' in s
          assert 'stock_fund_flow_industry(symbol=\'5日排行\')' in s
          assert 'em_rank' not in s
          assert '_fetch_same_source_members' not in s
          assert 'class StockScannerApp:' not in s
          PY
      - name: Verify Tkinter, market backend, and true Qt GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Render real PySide6 4-by-3 preview
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p docs
          xvfb-run -a python A股MA扫描器_v1.2.8.pyw --demo --screenshot docs/pyside6-v1.2.8.png
          test -s docs/pyside6-v1.2.8.png
      - name: Prepare standalone script and ZIP
        run: |
          cp 'A股MA扫描器_v1.2.8.pyw' AShareMAScanner_v1.2.8.pyw
          python - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('AShareMAScanner_v1.2.8.zip','w',ZIP_DEFLATED) as archive:
              for p in ['A股MA扫描器_v1.2.8.pyw','requirements.txt','README.md']:
                  archive.write(p)
          PY
      - name: Publish real tested source version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.2.8 >/dev/null 2>&1; then
            gh release create v1.2.8 \
              --target "$GITHUB_SHA" \
              --title "v1.2.8 · Tkinter 三阶段 / PySide6 4:3 单文件" \
              --notes-file RELEASE_NOTES_v1.2.8.md --latest
          fi
          gh release upload v1.2.8 AShareMAScanner_v1.2.8.pyw AShareMAScanner_v1.2.8.zip --clobber
