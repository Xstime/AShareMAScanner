name: v1.5.0 pre-release Linux Windows macOS check (no publish)
on:
  push:
    branches: [release/v1.5.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt and Tk runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile production source
        run: python -m py_compile 'A股MA扫描器_v1.5.0.pyw'
      - name: Verify remote snapshot and override contracts
        run: python -m unittest discover -s client/tests -v
      - name: Verify existing scanner and update regressions
        run: |
          python -m unittest discover -s tests -p test_dev_eight_strategy_math.py -v
          python -m unittest discover -s tests -p test_dev_scan_cache_and_widgets.py -v
          python -m unittest discover -s tests -p test_dev_full_pipeline.py -v
          python -m unittest discover -s tests -p test_dev_desktop_update_pyw.py -v
      - name: Validate actual Qt window rendering
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python 'A股MA扫描器_v1.5.0.pyw' --demo --screenshot /tmp/v150.png
          python - <<'PY'
          from PySide6.QtGui import QImage
          image=QImage('/tmp/v150.png')
          assert not image.isNull() and (image.width(),image.height())==(1120,840)
          PY
