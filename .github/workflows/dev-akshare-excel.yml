name: Dev AKShare and Excel tests (no publish)
on:
  push:
    branches: [dev/akshare-excel-v136]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile development source
        run: python -m py_compile "A股MA扫描器_dev_AKShare.pyw"
      - name: Offline regression on Windows and macOS
        if: runner.os != 'Linux'
        run: |
          python -m unittest discover -s tests -p test_dev_akshare_excel.py -v
          python -m unittest discover -s tests -p test_dev_eight_strategy_math.py -v
          python -m unittest discover -s tests -p test_dev_sector_recovery.py -v
          python -m unittest discover -s tests -p test_dev_real_ui_pipeline.py -v
          python -m unittest discover -s tests -p test_dev_scan_cache_and_widgets.py -v
          python -m unittest discover -s tests -p test_dev_full_pipeline.py -v
      - name: Offline regression on Linux
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -m unittest discover -s tests -p test_dev_akshare_excel.py -v
          xvfb-run -a python -m unittest discover -s tests -p test_dev_eight_strategy_math.py -v
          xvfb-run -a python -m unittest discover -s tests -p test_dev_sector_recovery.py -v
          xvfb-run -a python -m unittest discover -s tests -p test_dev_real_ui_pipeline.py -v
          xvfb-run -a python -m unittest discover -s tests -p test_dev_scan_cache_and_widgets.py -v
          xvfb-run -a python -m unittest discover -s tests -p test_dev_full_pipeline.py -v
