name: macOS Tk/Tcl teardown regression
on:
  push:
    branches: [fix/macos-tk-teardown-20261101]
    paths:
      - 'A股MA扫描器_v1.3.1.pyw'
      - 'tests/test_macos_tk_lifecycle_132.py'
      - 'tests/test_market_cancel_tk_131.py'
      - '.github/workflows/test-macos-tk-teardown.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Tk and install Python dependencies
        run: |
          python -c 'import tkinter; print("Tcl", tkinter.TclVersion, "Tk", tkinter.TkVersion)'
          python -m pip install -r requirements.txt
      - name: Compile both versions, run native Tk to Qt and cancel tests
        run: |
          set -euo pipefail
          python -m py_compile 'A股MA扫描器_v1.3.1.pyw' 'A股MA扫描器_v1.3.0.pyw'
          python -m unittest discover -s tests -p 'test_macos_tk_lifecycle_132.py' -v
          python -m unittest discover -s tests -p 'test_market_cancel_tk_131.py' -v
          python -m unittest discover -s tests -p 'test_manual_self_update_131.py' -v
          python -m unittest discover -s tests -p 'test_low_first_board_131.py' -v

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tk/Qt and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install -r requirements.txt
      - name: Compile and run Tk/Qt transition and previous regression
        run: |
          set -euo pipefail
          python -m py_compile 'A股MA扫描器_v1.3.1.pyw' 'A股MA扫描器_v1.3.0.pyw'
          for suite in test_macos_tk_lifecycle_132.py test_market_cancel_tk_131.py test_low_first_board_131.py test_update_download_progress_132.py test_v131_full_audit.py; do
            xvfb-run -a python -m unittest discover -s tests -p "$suite" -v
          done

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and run Tk/Qt transition
        shell: pwsh
        run: |
          python -m py_compile 'A股MA扫描器_v1.3.1.pyw'
          python -m unittest discover -s tests -p 'test_macos_tk_lifecycle_132.py' -v
          python -m unittest discover -s tests -p 'test_market_cancel_tk_131.py' -v
          python -m unittest discover -s tests -p 'test_update_download_progress_132.py' -v
