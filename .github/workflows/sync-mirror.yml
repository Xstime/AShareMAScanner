name: Manually sync official Release to VPS mirror (OIDC)
on:
  workflow_dispatch:
# The v1.3.2 release workflow itself awaits sync confirmation.
# Separate automatic workflow_run would duplicate POST /publish and race
# the sync_request_id check. This remains a manual recovery entrypoint.
permissions:
  contents: read
jobs:
  sync:
    if: >-
      github.repository == 'Xstime/AShareMAScanner' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify latest official Release, notify VPS using ephemeral OIDC, await request_id
        run: python3 scripts/sync_mirror.py
