name: Sync official Release to VPS mirror (OIDC)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-mirror.yml'
      - 'scripts/sync_mirror.py'
  workflow_run:
    workflows: ["Publish v1.3.2 after Linux Windows macOS verification"]
    types: [completed]
permissions:
  contents: read
jobs:
  sync:
    if: >-
      github.repository == 'Xstime/AShareMAScanner' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify latest official Release, notify VPS using ephemeral OIDC, await request_id
        run: python3 scripts/sync_mirror.py
