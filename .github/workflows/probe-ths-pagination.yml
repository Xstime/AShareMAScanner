name: Test public THS industry pagination paths

on:
  workflow_dispatch:
  push:
    branches:
      - dev/v1.2.7-pyside6
    paths:
      - 'tools/probe_ths_pagination.py'
      - '.github/workflows/probe-ths-pagination.yml'

permissions:
  contents: read

jobs:
  pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python -u tools/probe_ths_pagination.py
