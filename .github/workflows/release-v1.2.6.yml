name: Publish v1.2.6 release

on:
  push:
    branches:
      - main
    paths:
      - 'A股MA扫描器_v1.2.6.pyw'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python entry point
        run: python -m py_compile A股MA扫描器_v1.2.6.pyw

      - name: Install offline test dependencies
        run: python -m pip install pandas

      - name: Prepare headless desktop
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Run regression tests before publishing
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Publish verified .pyw to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.6 >/dev/null 2>&1; then
            echo "Release v1.2.6 already exists; not replacing published assets."
            exit 0
          fi
          gh release create v1.2.6 "A股MA扫描器_v1.2.6.pyw" \
            --target "$GITHUB_SHA" \
            --title "v1.2.6 · 可视化行情加载" \
            --notes-file RELEASE_NOTES_v1.2.6.md \
            --latest
