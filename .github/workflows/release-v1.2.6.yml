name: Publish v1.2.6 release

on:
  push:
    branches:
      - main
    paths:
      - 'A股MA扫描器_v1.2.6.pyw'
      - '.github/workflows/release-v1.2.6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python entry point
        run: python -m py_compile A股MA扫描器_v1.2.6.pyw

      - name: Install offline test dependencies
        run: python -m pip install pandas

      - name: Prepare headless desktop
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Run regression tests before publishing
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Prepare easy-to-download release files
        run: |
          cp "A股MA扫描器_v1.2.6.pyw" AShareMAScanner_v1.2.6.pyw
          python - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('AShareMAScanner_v1.2.6.zip', 'w', ZIP_DEFLATED) as bundle:
              for filename in ['A股MA扫描器_v1.2.6.pyw', 'requirements.txt', 'README.md']:
                  bundle.write(filename)
          PY

      - name: Publish verified Windows script and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.2.6 >/dev/null 2>&1; then
            gh release create v1.2.6 \
              --target "$GITHUB_SHA" \
              --title "v1.2.6 · 可视化行情加载" \
              --notes-file RELEASE_NOTES_v1.2.6.md \
              --latest
          fi
          gh release upload v1.2.6 AShareMAScanner_v1.2.6.pyw AShareMAScanner_v1.2.6.zip --clobber
          # GitHub rewrites non-ASCII asset filenames. Remove the ambiguous auto-renamed copy.
          if gh release view v1.2.6 --json assets --jq '.assets[].name' | grep -Fxq 'A.MA._v1.2.6.pyw'; then
            gh release delete-asset v1.2.6 'A.MA._v1.2.6.pyw' --yes
          fi
