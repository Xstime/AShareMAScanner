name: 4-by-3 desktop UI regression

on:
  push:
    branches:
      - dev/v1.2.7-ui
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  desktop-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check for new desktop script
        run: python -m py_compile A股MA扫描器_v1.2.7.pyw
      - name: Install test dependencies
        run: python -m pip install pandas
      - name: Virtual graphical display
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Exercise new three-column GUI
        run: xvfb-run -a python -m unittest discover -s tests -p 'test_ui_43.py' -v
