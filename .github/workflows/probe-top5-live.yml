name: Live TOP5 provider diagnostics (nonblocking)

on:
  workflow_dispatch:
  push:
    branches:
      - dev/v1.2.7-pyside6
    paths:
      - 'tools/probe_top5_live.py'
      - '.github/workflows/probe-top5-live.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production implementation
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual market-data dependencies
        run: python -m pip install --disable-pip-version-check pandas baostock akshare
      - name: Real-world TOP5 rank and five constituent endpoints per source
        run: timeout 450s python -u tools/probe_top5_live.py
