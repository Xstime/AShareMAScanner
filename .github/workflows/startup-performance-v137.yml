name: Startup performance regression (dev only)
on:
  push:
    branches: [dev/startup-performance-v137]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Compile production and development source
        run: python -m py_compile "A股MA扫描器_v1.3.7.pyw" "A股MA扫描器_dev_AKShare.pyw"
      - name: Run startup optimization and complete offline regression suites
        shell: bash
        run: |
          set -euo pipefail
          suites="test_startup_performance_v137.py test_dev_akshare_excel.py test_dev_eight_strategy_math.py test_dev_sector_recovery.py test_dev_real_ui_pipeline.py test_dev_scan_cache_and_widgets.py test_dev_full_pipeline.py test_dev_desktop_update_pyw.py test_v137_release_parity.py"
          for suite in $suites; do
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              xvfb-run -a python -m unittest discover -s tests -p "$suite" -v
            else
              python -m unittest discover -s tests -p "$suite" -v
            fi
          done
      - name: Render the actual v1.3.7 GUI without market requests
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python 'A股MA扫描器_v1.3.7.pyw' --demo --screenshot /tmp/v137-perf.png
          python - <<'PY'
          from PySide6.QtGui import QImage
          image=QImage('/tmp/v137-perf.png')
          assert not image.isNull() and (image.width(),image.height())==(1120,840)
          print("v1.3.7 demo UI render passed")
          PY
