name: Publish v1.3.1 after full Linux and Windows verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.3.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt/Tk native libraries and Python requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install -r requirements.txt
      - name: Test v1.3.1 and preserved v1.3.0 compatibility
        run: |
          set -euo pipefail
          python -m py_compile 'A股MA扫描器_v1.3.1.pyw' 'A股MA扫描器_v1.3.0.pyw'
          for suite in test_low_first_board_131.py test_update_download_progress_132.py test_manual_self_update_131.py test_v131_full_audit.py test_update_download_progress_131.py test_manual_self_update_130.py test_v130_full_audit.py test_fresh_robustness_130.py test_spawn_isolation_130.py test_day_parallel_speed_130.py; do
            xvfb-run -a python -m unittest discover -s tests -p "$suite" -v
          done
      - name: Render actual 1120x840 PySide6 v1.3.1 window
        run: |
          xvfb-run -a python 'A股MA扫描器_v1.3.1.pyw' --demo --screenshot /tmp/v131.png
          python - <<'PY'
          from PySide6.QtGui import QImage
          image=QImage('/tmp/v131.png')
          assert not image.isNull() and (image.width(),image.height())==(1120,840)
          print('v1.3.1 GUI rendered correctly')
          PY

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Windows 1.3.1 updater and 8 strategies / legacy regression
        shell: pwsh
        run: |
          python -m py_compile "A股MA扫描器_v1.3.1.pyw" "A股MA扫描器_v1.3.0.pyw"
          python -m unittest discover -s tests -p "test_low_first_board_131.py" -v
          python -m unittest discover -s tests -p "test_update_download_progress_132.py" -v
          python -m unittest discover -s tests -p "test_manual_self_update_131.py" -v
          python -m unittest discover -s tests -p "test_v131_full_audit.py" -v
          python -m unittest discover -s tests -p "test_manual_self_update_130.py" -v
          python -m unittest discover -s tests -p "test_v130_full_audit.py" -v
          python -m unittest discover -s tests -p "test_fresh_robustness_130.py" -v
          python -m unittest discover -s tests -p "test_spawn_isolation_130.py" -v

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version, commit and unused release tag
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(grep -c '^APP_VERSION = "1.3.1"$' 'A股MA扫描器_v1.3.1.pyw')" = 1
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.3.1" > /dev/null 2>&1; then
            echo "::error::v1.3.1 tag already exists; will not overwrite an existing release"
            exit 1
          fi
      - name: Assemble source-equivalent .pyw and ZIP
        run: |
          set -euo pipefail
          mkdir -p output
          cp 'A股MA扫描器_v1.3.1.pyw' output/AShareMAScanner_v1.3.1.pyw
          python - <<'PY'
          from zipfile import ZipFile,ZIP_DEFLATED
          files=('A股MA扫描器_v1.3.1.pyw','requirements.txt','README.md','RELEASE_NOTES_v1.3.1.md')
          with ZipFile('output/AShareMAScanner_v1.3.1.zip','w',ZIP_DEFLATED,compresslevel=9) as z:
              for filename in files:
                  z.write(filename,filename)
          with ZipFile('output/AShareMAScanner_v1.3.1.zip') as z:
              assert z.testzip() is None
              assert set(z.namelist()) == set(files)
          PY
          sha256sum output/*
      - name: Create protected DRAFT release
        run: |
          set -euo pipefail
          gh release create v1.3.1 \
            output/AShareMAScanner_v1.3.1.pyw \
            output/AShareMAScanner_v1.3.1.zip \
            --draft --title "v1.3.1 · 低位首板放量与下载进度" \
            --notes-file RELEASE_NOTES_v1.3.1.md \
            --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
      - name: Verify draft assets SHA-256 and sizes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          releases=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases?per_page=100']))
          candidates=[r for r in releases if r['tag_name']=='v1.3.1']
          assert len(candidates)==1 and candidates[0]['draft'] is True
          release=candidates[0]
          assets={a['name']:a for a in release['assets']}
          assert set(assets)=={'AShareMAScanner_v1.3.1.pyw','AShareMAScanner_v1.3.1.zip'}
          for name, asset in assets.items():
              data=open('output/'+name,'rb').read()
              assert asset['size']==len(data),name
              assert asset['digest']=='sha256:'+hashlib.sha256(data).hexdigest(),name
          print('Both draft release assets verified before publication')
          PY
      - name: Publish signed-by-GitHub-asset-digest latest release
        run: |
          set -euo pipefail
          gh release edit v1.3.1 --draft=false --latest --repo "$GITHUB_REPOSITORY"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = 'v1.3.1'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.3.1" --jq '.object.sha')" = "$GITHUB_SHA"
          echo "Published and verified v1.3.1"
