name: Dev v1.2.8 repaired full-function tests
on:
  push:
    branches: [dev/v1.2.8-full-fix]
    paths:
      - 'tests/test_v128_full_audit.py'
      - 'tests/test_fresh_robustness.py'
      - 'tests/test_live_sqlite_gui.py'
      - 'A股MA扫描器_v1.2.8.pyw'
      - '.github/workflows/dev-v1.2.8-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tk and Qt native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python source syntax checks
        run: python -m py_compile 'A股MA扫描器_v1.2.6.pyw' 'A股MA扫描器_v1.2.8.pyw'
      - name: Execute existing and new regression groups, keep independent logs
        shell: bash
        run: |
          mkdir -p audit-evidence
          for suite in test_hybrid_pyside6.py test_ths_top5_only.py test_three_stage_tk.py test_github_updates.py test_progress_visualizer.py test_startup_splash.py test_fund_sources.py test_v128_full_audit.py test_fresh_robustness.py test_live_sqlite_gui.py; do
            set +e
            xvfb-run -a python -m unittest discover -s tests -p "$suite" -v > "audit-evidence/$suite.log" 2>&1
            echo "$?" > "audit-evidence/$suite.exit"
            tail -n 24 "audit-evidence/$suite.log"
          done
          exit 0
      - name: Capture actual PySide6 demo screenshot
        shell: bash
        run: |
          mkdir -p audit-evidence
          QT_QPA_PLATFORM=offscreen xvfb-run -a python 'A股MA扫描器_v1.2.8.pyw' --demo --screenshot audit-evidence/workbench.png
          test -s audit-evidence/workbench.png
          python - <<'PY'
          from PySide6.QtGui import QImage
          image=QImage("audit-evidence/workbench.png")
          assert not image.isNull()
          assert (image.width(),image.height())==(1120,840), (image.width(),image.height())
          print("Verified real 1120x840 PySide6 GUI screenshot")
          PY
      - name: Upload auditable raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v128-regression-evidence
          path: audit-evidence/
      - name: Report blocked release if any feature suite fails
        run: |
          for p in audit-evidence/*.exit; do
            if [ "$(cat "$p")" != "0" ]; then
              echo "::error::Release blocked by $p"
              exit 1
            fi
          done

  windows-robustness:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies on native Windows
        run: python -m pip install -r requirements.txt
      - name: Compile both sources
        run: python -m py_compile "A股MA扫描器_v1.2.6.pyw" "A股MA扫描器_v1.2.8.pyw"
      - name: Run native Windows headless functional and error-handling tests
        run: |
          python -m unittest discover -s tests -p "test_fresh_robustness.py" -v
          python -m unittest discover -s tests -p "test_live_sqlite_gui.py" -v
          python -m unittest discover -s tests -p "test_v128_full_audit.py" -v
          python -m unittest discover -s tests -p "test_hybrid_pyside6.py" -v
          python -m unittest discover -s tests -p "test_ths_top5_only.py" -v
