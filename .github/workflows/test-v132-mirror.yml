name: Dev v1.3.2 VPS mirror client tests
on:
  push:
    branches: [dev/v1.3.2-vps-mirror-client]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt/Tk and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install -r requirements.txt
      - name: Run mirror and old-version regressions
        run: |
          set -euo pipefail
          python -m py_compile 'A股MA扫描器_v1.3.2.pyw' 'A股MA扫描器_v1.3.1.pyw'
          xvfb-run -a python -m unittest discover -s tests -p test_mirror_updater_132.py -v
          for suite in test_low_first_board_131.py test_manual_self_update_131.py test_update_download_progress_132.py test_v131_full_audit.py test_fresh_robustness_130.py; do
            xvfb-run -a python -m unittest discover -s tests -p "$suite" -v
          done
      - name: Live mirror health, HEAD, HTTP 206 and full SHA verification
        run: python tests/live_probe_mirror_readonly_132.py
      - name: Screenshot actual PySide6 application
        run: |
          xvfb-run -a python 'A股MA扫描器_v1.3.2.pyw' --demo --screenshot /tmp/v132.png
          python - <<'PY'
          from PySide6.QtGui import QImage
          i=QImage('/tmp/v132.png')
          assert not i.isNull() and (i.width(),i.height())==(1120,840)
          PY
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Native Windows mirror and prior updater tests
        shell: pwsh
        run: |
          python -m py_compile "A股MA扫描器_v1.3.2.pyw"
          python -m unittest discover -s tests -p "test_mirror_updater_132.py" -v
          python -m unittest discover -s tests -p "test_manual_self_update_131.py" -v
          python -m unittest discover -s tests -p "test_low_first_board_131.py" -v
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -c "import tkinter; print(tkinter.TkVersion)"
          python -m pip install -r requirements.txt
      - name: Native macOS mirror client tests
        run: |
          set -euo pipefail
          python -m py_compile 'A股MA扫描器_v1.3.2.pyw'
          python -m unittest discover -s tests -p test_mirror_updater_132.py -v
          python -m unittest discover -s tests -p test_low_first_board_131.py -v
